<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entreno">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Plan de entrenamiento</title>
<style>
  :root{
    --bg:#0b0d12; --card:#161922; --card2:#1d212b; --border:#272c38;
    --text:#f2f4f7; --text2:#9aa3b5; --muted:#5d6474;
    --accent:#5b8cff; --accent2:#1e3a66; --accent-soft:rgba(91,140,255,0.12);
    --green:#34d399; --greenbg:#0f2a20;
    --amber:#f2b84b; --amberbg:#2a2312;
    --red:#f87171; --redbg:#2a1418;
    --radius:16px;
    --shadow:0 4px 18px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-bottom:44px;
  }
  header{
    padding:22px 16px 16px; position:sticky; top:0; z-index:10;
    background:linear-gradient(180deg, rgba(91,140,255,0.10), rgba(11,13,18,0) 90%), var(--bg);
    border-bottom:0.5px solid var(--border);
  }
  h1{font-size:19px; font-weight:700; margin:0 0 3px; letter-spacing:-0.2px;}
  .sub{font-size:13px; color:var(--text2); margin:0;}
  .streak-pill{
    display:inline-flex; align-items:center; gap:5px; margin-top:8px;
    background:var(--card2); border:0.5px solid var(--border); border-radius:20px;
    padding:5px 12px; font-size:12px; color:var(--amber); font-weight:600;
  }

  .summary-row{display:flex; gap:8px; padding:12px 16px 0;}
  .summary-card{
    flex:1; background:var(--card); border:0.5px solid var(--border); border-radius:14px;
    padding:11px 13px; box-shadow:var(--shadow);
  }
  .summary-label{font-size:10.5px; color:var(--muted); margin-bottom:3px; text-transform:uppercase; letter-spacing:0.4px;}
  .summary-value{font-size:19px; font-weight:700;}
  .summary-value.small{font-size:14px; font-weight:500;}
  .summary-delta{font-size:11.5px; margin-left:4px; font-weight:600;}
  .delta-down{color:var(--green);}
  .delta-up{color:var(--red);}

  .phase-row{display:flex; gap:8px; padding:16px 16px 0;}
  .phase-btn{
    flex:1; padding:10px 4px; text-align:center; border-radius:11px;
    border:0.5px solid var(--border); background:var(--card); color:var(--text2);
    font-size:13px; font-weight:600; transition:all .15s ease;
  }
  .phase-btn.active{background:var(--accent2); border-color:var(--accent); color:#d6e3ff; box-shadow:0 0 0 1px var(--accent) inset;}

  .week{padding:14px 16px 4px; display:flex; flex-direction:column; gap:9px;}

  .day-card{
    background:var(--card); border:0.5px solid var(--border); border-radius:var(--radius);
    overflow:hidden; box-shadow:var(--shadow); border-left:3px solid var(--border);
    transition:border-color .15s ease;
  }
  .day-card.type-fuerza{border-left-color:var(--accent);}
  .day-card.type-carrera{border-left-color:var(--green);}
  .day-card.type-recuperacion{border-left-color:var(--amber);}
  .day-card.type-wod{border-left-color:var(--red);}
  .day-card.is-today{background:linear-gradient(180deg, var(--accent-soft), var(--card) 40%);}

  .day-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 14px 14px 12px; cursor:pointer;
  }
  .day-left{display:flex; align-items:flex-start; gap:10px;}
  .day-icon{font-size:19px; line-height:1; margin-top:1px;}
  .day-name{font-size:15px; font-weight:600;}
  .day-name.done-strike{color:var(--text2); text-decoration:line-through; text-decoration-color:var(--green); text-decoration-thickness:2px;}
  .day-focus{font-size:12.5px; color:var(--text2); margin-top:2px;}
  .day-right{display:flex; align-items:center; gap:8px;}
  .day-dur{font-size:11.5px; color:var(--muted);}
  .check-badge{
    width:26px; height:26px; border-radius:50%; border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--muted);
    flex-shrink:0; transition:all .15s ease;
  }
  .check-badge.done{background:var(--green); border-color:var(--green); color:#08301a;}
  .today-dot{width:6px; height:6px; border-radius:50%; background:var(--accent); flex-shrink:0;}

  .day-body{display:none; padding:0 14px 16px; border-top:0.5px solid var(--border);}
  .day-body.open{display:block; animation:fadeIn .18s ease;}
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}

  .exercise{padding:12px 0; border-bottom:0.5px solid var(--border);}
  .exercise:last-child{border-bottom:none;}
  .ex-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .ex-name{font-size:14px; font-weight:500;}
  .ex-target{font-size:12px; color:var(--text2); margin-top:2px;}
  .ex-last{font-size:11.5px; color:var(--accent); margin-top:2px;}
  .ex-check{
    width:28px; height:28px; border-radius:50%; border:1.5px solid var(--border);
    flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--muted);
  }
  .ex-check.done{background:var(--green); border-color:var(--green); color:#08301a;}

  .ex-inputs{display:flex; gap:8px; margin-top:8px;}
  .ex-inputs input{
    flex:1; background:var(--card2); border:0.5px solid var(--border); border-radius:9px;
    color:var(--text); font-size:14px; padding:9px 10px; width:100%;
  }
  .ex-inputs input::placeholder{color:var(--muted);}
  .ex-inputs label{font-size:10.5px; color:var(--muted); display:block; margin-bottom:3px;}

  .simple-toggle{
    margin-top:6px; display:inline-flex; align-items:center; gap:6px;
    font-size:13px; color:var(--text2); padding:10px 14px; border-radius:9px;
    border:0.5px solid var(--border); background:var(--card2); width:100%; justify-content:center;
  }
  .simple-toggle.done{color:#8fe8b6; border-color:var(--green); background:var(--greenbg);}

  .save-row{margin-top:14px;}
  .save-btn{
    width:100%; padding:12px; border-radius:11px; border:none;
    background:linear-gradient(135deg, var(--accent), #3f6fe0);
    color:white; font-size:14px; font-weight:700;
  }
  .save-btn:active{opacity:0.85;}
  .saved-note{font-size:12px; color:var(--green); text-align:center; margin-top:8px; display:none;}

  .footer-nav{display:flex; gap:5px; padding:16px 12px 6px; position:sticky; bottom:0; background:var(--bg); border-top:0.5px solid var(--border);}
  .nav-btn{
    flex:1; padding:8px 2px; text-align:center; border-radius:11px; border:0.5px solid var(--border);
    background:var(--card); color:var(--text2); font-size:10.5px; font-weight:600;
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .nav-btn .nav-icon{font-size:16px;}
  .nav-btn.active{color:var(--text); border-color:var(--accent); background:var(--accent-soft);}

  .history{padding:4px 16px 20px;}
  .hist-item{
    background:var(--card); border:0.5px solid var(--border); border-radius:12px;
    padding:12px 14px; margin-bottom:8px; box-shadow:var(--shadow);
  }
  .hist-date{font-size:13px; font-weight:600; margin-bottom:6px; text-transform:capitalize;}
  .hist-line{font-size:12.5px; color:var(--text2); display:flex; justify-content:space-between; padding:2px 0;}
  .hist-empty{color:var(--muted); font-size:13px; text-align:center; padding:30px 0;}

  .date-picker-row{padding:10px 16px 0; display:flex; align-items:center; gap:8px;}
  .date-picker-row input[type=date]{
    background:var(--card2); border:0.5px solid var(--border); border-radius:9px;
    color:var(--text); font-size:13px; padding:8px 10px; flex:1;
  }
  .today-btn{font-size:12px; color:var(--accent); padding:8px 10px; border:0.5px solid var(--border); border-radius:9px; background:var(--card2);}

  .comment-box{margin-top:10px;}
  .comment-box label{font-size:10.5px; color:var(--muted); display:block; margin-bottom:3px;}
  .comment-box textarea{
    width:100%; background:var(--card2); border:0.5px solid var(--border); border-radius:9px;
    color:var(--text); font-size:13.5px; padding:9px 10px; min-height:44px; resize:vertical;
    font-family:inherit;
  }
  .add-ex-btn{
    width:100%; margin-top:6px; padding:10px; border-radius:9px; border:1px dashed var(--border);
    background:transparent; color:var(--text2); font-size:13px;
  }
  .custom-ex-name{
    width:100%; background:var(--card2); border:0.5px solid var(--border); border-radius:9px;
    color:var(--text); font-size:14px; padding:9px 10px; margin-bottom:6px;
  }
  .export-btn{
    width:100%; padding:12px; border-radius:11px; border:0.5px solid var(--accent); background:transparent;
    color:var(--accent); font-size:13.5px; font-weight:700; margin-bottom:14px;
  }
  .export-box{
    background:var(--card2); border:0.5px solid var(--border); border-radius:10px; padding:10px;
    font-size:11.5px; color:var(--text2); white-space:pre-wrap; max-height:200px; overflow-y:auto; margin-bottom:14px;
    display:none;
  }

  .weight-view{padding:14px 16px 20px;}
  .weight-form{
    display:flex; gap:8px; background:var(--card); border:0.5px solid var(--border);
    border-radius:14px; padding:12px; margin-bottom:14px; box-shadow:var(--shadow);
  }
  .weight-form input[type=date]{
    background:var(--card2); border:0.5px solid var(--border); border-radius:9px;
    color:var(--text); font-size:13px; padding:9px 8px; width:118px;
  }
  .weight-form input[type=number]{
    flex:1; background:var(--card2); border:0.5px solid var(--border); border-radius:9px;
    color:var(--text); font-size:15px; padding:9px 10px;
  }
  .weight-form button{
    padding:9px 14px; border-radius:9px; border:none; background:var(--accent); color:white; font-size:13px; font-weight:700;
  }
  .weight-row{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--card); border:0.5px solid var(--border); border-radius:11px;
    padding:11px 14px; margin-bottom:6px;
  }
  .weight-date{font-size:13px; color:var(--text2);}
  .weight-kg{font-size:15px; font-weight:700;}
  .weight-del{color:var(--muted); font-size:12px; padding:4px 8px;}

  .cal-view{padding:12px 16px 20px;}
  .cal-nav{display:flex; align-items:center; justify-content:space-between; padding:4px 2px 14px;}
  .cal-nav button{
    background:var(--card); border:0.5px solid var(--border); color:var(--text); font-size:16px;
    width:36px; height:36px; border-radius:10px;
  }
  .cal-month-label{font-size:15px; font-weight:700; text-transform:capitalize;}
  .cal-legend{display:flex; gap:14px; font-size:11px; color:var(--text2); padding-bottom:12px;}
  .cal-legend span{display:inline-flex; align-items:center; gap:5px;}
  .cal-dot{width:8px; height:8px; border-radius:50%;}
  .cal-grid{display:grid; grid-template-columns:repeat(7, 1fr); gap:6px;}
  .cal-dow{text-align:center; font-size:10.5px; color:var(--muted); font-weight:600; padding-bottom:4px;}
  .cal-cell{
    aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:10px; font-size:13px; position:relative; border:0.5px solid transparent;
  }
  .cal-cell.pad{visibility:hidden;}
  .cal-cell.in-month{background:var(--card); color:var(--text);}
  .cal-cell.future{color:var(--muted); background:var(--card2);}
  .cal-cell.done{background:var(--greenbg); border-color:var(--green);}
  .cal-cell.done .cal-num{color:#8fe8b6; text-decoration:line-through; text-decoration-color:var(--green);}
  .cal-cell.missed{background:var(--card2); border-color:var(--border);}
  .cal-cell.is-today{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset;}
  .cal-num{font-weight:600;}

  .prog-view{padding:12px 16px 24px;}
  .prog-card{
    background:var(--card); border:0.5px solid var(--border); border-radius:14px;
    padding:14px; margin-bottom:16px; box-shadow:var(--shadow);
  }
  .prog-title{font-size:13.5px; font-weight:700; margin-bottom:2px;}
  .prog-sub{font-size:11.5px; color:var(--text2); margin-bottom:10px;}
  .prog-empty{font-size:12.5px; color:var(--muted); text-align:center; padding:20px 0;}
  .ex-select{
    width:100%; background:var(--card2); border:0.5px solid var(--border); border-radius:9px;
    color:var(--text); font-size:13px; padding:9px 10px; margin-bottom:10px;
  }
  .chart-delta{font-size:12px; margin-top:6px; text-align:center; color:var(--text2);}

  .profile-picker{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:24px;
  }
  .profile-picker h2{font-size:19px; margin:0 0 4px;}
  .profile-picker p{font-size:13px; color:var(--text2); margin:0 0 10px; text-align:center;}
  .profile-btns{display:flex; gap:14px; width:100%; max-width:340px;}
  .profile-btn{
    flex:1; padding:22px 10px; border-radius:16px; border:0.5px solid var(--border);
    background:var(--card); color:var(--text); font-size:15px; font-weight:700;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .profile-avatar{
    width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:19px; font-weight:700; color:#0b0d12;
  }
  .avatar-borja{background:var(--accent);}
  .avatar-tati{background:#e879b5;}

  .user-switch{
    position:absolute; top:20px; right:16px; font-size:11px; color:var(--text2);
    background:var(--card2); border:0.5px solid var(--border); border-radius:8px; padding:5px 9px;
  }

  .race-card{
    margin:12px 16px 0; background:linear-gradient(135deg, rgba(248,113,113,0.14), var(--card));
    border:0.5px solid var(--red); border-radius:14px; padding:12px 14px; box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:space-between;
  }
  .race-left{display:flex; flex-direction:column;}
  .race-title{font-size:12.5px; font-weight:700; color:#fca5a5;}
  .race-sub{font-size:11px; color:var(--text2); margin-top:1px;}
  .race-days{font-size:22px; font-weight:800; color:#fca5a5; line-height:1;}
  .race-days-label{font-size:9.5px; color:var(--text2); text-align:center; text-transform:uppercase;}

  .compare-row{display:flex; gap:10px; margin-top:6px;}
  .compare-col{flex:1; background:var(--card2); border-radius:10px; padding:10px; text-align:center;}
  .compare-name{font-size:11.5px; color:var(--text2); margin-bottom:4px; font-weight:600;}
  .compare-val{font-size:18px; font-weight:700;}
  .compare-sub{font-size:10.5px; color:var(--muted); margin-top:2px;}

  .ramp-card{
    margin:12px 16px 0; background:var(--card); border:0.5px solid var(--border); border-radius:14px;
    padding:13px 14px; box-shadow:var(--shadow);
  }
  .ramp-title{font-size:13px; font-weight:700; margin-bottom:2px;}
  .ramp-sub{font-size:11.5px; color:var(--text2); margin-bottom:10px;}
  .ramp-list{display:flex; flex-direction:column; gap:6px;}
  .ramp-row{
    display:flex; justify-content:space-between; align-items:center; font-size:12.5px;
    background:var(--card2); border-radius:9px; padding:8px 11px;
  }
  .ramp-row.next{border:1px solid var(--accent); background:var(--accent-soft);}
  .ramp-date{color:var(--text2);}
  .ramp-km{font-weight:700;}
  .ramp-note{font-size:10.5px; color:var(--muted);}

  .nutri-card{
    margin:12px 16px 0; background:var(--card); border:0.5px solid var(--border); border-radius:14px;
    padding:13px 14px; box-shadow:var(--shadow);
  }
  .nutri-title{font-size:13px; font-weight:700; margin-bottom:2px; display:flex; align-items:center; gap:6px;}
  .nutri-sub{font-size:11.5px; color:var(--text2); margin-bottom:10px;}
  .nutri-row{
    display:flex; align-items:center; gap:10px; padding:8px 0; border-top:0.5px solid var(--border);
  }
  .nutri-row:first-of-type{border-top:none;}
  .nutri-check{
    width:22px; height:22px; border-radius:7px; border:1.5px solid var(--border); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--muted);
  }
  .nutri-check.done{background:var(--green); border-color:var(--green); color:#08301a;}
  .nutri-label{font-size:13px; font-weight:500;}
  .nutri-detail{font-size:11.5px; color:var(--text2); margin-top:1px;}

  .stretch-section{margin-top:14px; padding-top:12px; border-top:0.5px dashed var(--border);}
  .stretch-title{font-size:12.5px; font-weight:700; color:var(--text2); margin-bottom:8px; display:flex; align-items:center; gap:6px;}
  .stretch-list{list-style:none; margin:0 0 10px; padding:0; display:flex; flex-direction:column; gap:6px;}
  .stretch-list li{
    font-size:12.5px; color:var(--text2); display:flex; justify-content:space-between; gap:8px;
    background:var(--card2); border-radius:8px; padding:7px 10px;
  }
  .stretch-list li b{color:var(--text); font-weight:500;}
</style>
</head>
<body>

<div class="profile-picker" id="profilePicker">
  <h2>¿Quién entrena hoy?</h2>
  <p>Cada uno ve solo su propio plan y su propio progreso.</p>
  <div class="profile-btns">
    <button class="profile-btn" data-user="borja">
      <span class="profile-avatar avatar-borja">B</span>
      Borja
    </button>
    <button class="profile-btn" data-user="tati">
      <span class="profile-avatar avatar-tati">T</span>
      Tati
    </button>
  </div>
</div>

<button class="user-switch" id="userSwitchBtn" style="display:none;">Cambiar ↺</button>

<header>
  <h1>Plan de entrenamiento</h1>
  <p class="sub" id="subtitle">Fuerza + carrera + base CrossFit</p>
  <div class="streak-pill" id="streakPill" style="display:none;"></div>
</header>

<div class="race-card" id="raceCard"></div>

<div id="rampCard" style="display:none;"></div>

<div class="summary-row" id="summaryRow"></div>

<div class="nutri-card" id="nutriCard"></div>

<div id="planTabContent">
  <div class="date-picker-row">
    <input type="date" id="datePicker">
    <button class="today-btn" onclick="goToday()">Hoy</button>
  </div>

  <div class="phase-row" id="phaseRow"></div>

  <div id="planView">
    <div class="week" id="weekList"></div>
  </div>
</div>

<div id="calView" class="cal-view" style="display:none;"></div>

<div id="progView" class="prog-view" style="display:none;"></div>

<div id="historyView" class="history" style="display:none;">
  <div class="prog-card" style="margin-bottom:14px;">
    <div class="prog-title">Copia de seguridad</div>
    <div class="prog-sub">Tus datos viven solo en este navegador. Descarga una copia de vez en cuando por si acaso.</div>
    <button class="add-ex-btn" id="backupDownloadBtn" style="margin-top:2px;">⬇ Descargar copia de seguridad</button>
    <button class="add-ex-btn" id="backupRestoreBtn" style="margin-top:8px;">⬆ Restaurar copia de seguridad</button>
    <input type="file" id="backupFileInput" accept="application/json" style="display:none;">
  </div>
  <div id="historyList"></div>
</div>

<div id="weightView" class="weight-view" style="display:none;">
  <div class="weight-form">
    <input type="date" id="weightDate">
    <input type="number" inputmode="decimal" step="0.1" id="weightKg" placeholder="kg">
    <button id="weightSaveBtn">Guardar</button>
  </div>
  <div id="weightList"></div>
</div>

<div class="footer-nav">
  <button class="nav-btn active" id="navPlan" onclick="switchView('plan')"><span class="nav-icon">📋</span>Plan</button>
  <button class="nav-btn" id="navCal" onclick="switchView('cal')"><span class="nav-icon">📅</span>Calendario</button>
  <button class="nav-btn" id="navProg" onclick="switchView('prog')"><span class="nav-icon">📈</span>Progreso</button>
  <button class="nav-btn" id="navWeight" onclick="switchView('weight')"><span class="nav-icon">⚖️</span>Peso</button>
  <button class="nav-btn" id="navHistory" onclick="switchView('history')"><span class="nav-icon">🗂️</span>Historial</button>
</div>

<script>
/* ---------- CAPA DE ALMACENAMIENTO ----------
   Esta app vive en GitHub Pages (fuera del entorno de artifacts de Claude),
   así que usa localStorage real del navegador. Si en algún momento se abre
   dentro del visor de artifacts de Claude, usa el storage que ese entorno
   ya proporciona en su lugar. */
if(!window.storage){
  window.storage = {
    async get(key){
      try{
        const v = localStorage.getItem(key);
        return v===null ? null : { key, value:v };
      }catch(e){ return null; }
    },
    async set(key, value){
      try{
        localStorage.setItem(key, value);
        return { key, value };
      }catch(e){ return null; }
    },
    async delete(key){
      try{
        localStorage.removeItem(key);
        return { key, deleted:true };
      }catch(e){ return null; }
    },
    async list(prefix){
      try{
        const keys = [];
        for(let i=0;i<localStorage.length;i++){
          const k = localStorage.key(i);
          if(!prefix || k.startsWith(prefix)) keys.push(k);
        }
        return { keys };
      }catch(e){ return { keys: [] }; }
    }
  };
}

function renderRaceCard(){
  const card = document.getElementById('raceCard');
  const today = new Date(todayStr()+'T00:00:00');
  const race = new Date(RACE_DATE+'T00:00:00');
  const diffDays = Math.round((race - today) / 86400000);
  const label = USER_LABEL[currentUser];
  const target = RACE_TARGET[currentUser];
  if(diffDays < 0){
    card.style.display = 'none';
    return;
  }
  card.style.display = 'flex';
  card.innerHTML = `
    <div class="race-left">
      <div class="race-title">🏔️ Trail — ${target}</div>
      <div class="race-sub">${label} · 4 de octubre de 2026</div>
    </div>
    <div style="text-align:center;">
      <div class="race-days">${diffDays}</div>
      <div class="race-days-label">días</div>
    </div>`;
}

function renderRampCard(){
  const card = document.getElementById('rampCard');
  const ramp = RUN_RAMP[currentUser];
  const today = todayStr();
  const future = ramp.filter(r => r.date >= today);
  if(future.length === 0){
    card.style.display = 'none';
    return;
  }
  const nextDate = future[0].date;
  const rows = ramp.map(r=>{
    const isPast = r.date < today;
    const isNext = r.date === nextDate;
    const label = formatDateShort(r.date);
    return `
      <div class="ramp-row ${isNext?'next':''}" style="${isPast?'opacity:0.45;':''}">
        <span class="ramp-date">${label}${r.note ? ' · <span class="ramp-note">'+r.note+'</span>' : ''}</span>
        <span class="ramp-km">${r.km} km</span>
      </div>`;
  }).join('');
  card.style.display = 'block';
  card.innerHTML = `
    <div class="ramp-card">
      <div class="ramp-title">📈 Progresión hacia el trail</div>
      <div class="ramp-sub">Objetivo de distancia para tu carrera larga del sábado</div>
      <div class="ramp-list">${rows}</div>
    </div>`;
}

function initProfile(){
  const saved = localStorage.getItem('activeUser');
  const picker = document.getElementById('profilePicker');
  const switchBtn = document.getElementById('userSwitchBtn');

  function chooseUser(u){
    currentUser = u;
    localStorage.setItem('activeUser', u);
    picker.style.display = 'none';
    switchBtn.style.display = 'block';
    startApp();
  }

  document.querySelectorAll('.profile-btn').forEach(btn=>{
    btn.onclick = ()=> chooseUser(btn.dataset.user);
  });

  switchBtn.onclick = ()=>{
    localStorage.removeItem('activeUser');
    location.reload();
  };

  if(saved && PLANS[saved]){
    currentUser = saved;
    picker.style.display = 'none';
    switchBtn.style.display = 'block';
    startApp();
  } else {
    picker.style.display = 'flex';
  }
}

async function renderNutriCard(){
  const card = document.getElementById('nutriCard');
  const dateKey = currentDate;
  let nutri = {};
  try{
    const res = await window.storage.get(uk('nutri:' + dateKey));
    nutri = res ? JSON.parse(res.value) : {};
  }catch(e){}

  const weights = await getAllWeights();
  let proteinLine = 'Objetivo orientativo: 1,6–2,2 g/kg de peso corporal al día.';
  if(weights.length>0){
    const kg = parseFloat(weights[0].kg);
    if(!isNaN(kg)){
      const low = Math.round(kg*1.6), high = Math.round(kg*2.2);
      proteinLine = `[estimación] Con ${kg}kg, tu rango orientativo serían ${low}–${high} g/día de proteína.`;
    }
  }

  const items = [
    { key:'creatina', label:'Creatina', detail:'3-5g, cualquier momento del día (dosis de mantenimiento habitual)' },
    { key:'proteina', label:'Proteína', detail: proteinLine },
    { key:'agua', label:'Hidratación', detail:'Especialmente en días de carrera o calor' },
  ];

  const rows = items.map(it=>{
    const done = !!nutri[it.key];
    return `
      <div class="nutri-row">
        <div class="nutri-check ${done?'done':''}" data-nkey="${it.key}">${done?'✓':''}</div>
        <div>
          <div class="nutri-label">${it.label}</div>
          <div class="nutri-detail">${it.detail}</div>
        </div>
      </div>`;
  }).join('');

  card.innerHTML = `
    <div class="nutri-title">🍽️ Hoy</div>
    <div class="nutri-sub">Pautas generales, no sustituyen el consejo de un profesional</div>
    ${rows}`;

  card.querySelectorAll('.nutri-check').forEach(el=>{
    el.onclick = async ()=>{
      el.classList.toggle('done');
      el.textContent = el.classList.contains('done') ? '✓' : '';
      const key = el.dataset.nkey;
      let n = {};
      try{
        const res = await window.storage.get(uk('nutri:' + dateKey));
        n = res ? JSON.parse(res.value) : {};
      }catch(e){}
      n[key] = el.classList.contains('done');
      await window.storage.set(uk('nutri:' + dateKey), JSON.stringify(n));
    };
  });
}

function stretchSectionHtml(d, idx, done){
  const key = stretchKeyFor(d);
  const list = STRETCHES[key];
  const items = list.map(s=> `<li><b>${s.name}</b><span>${s.detail}</span></li>`).join('');
  return `
    <div class="stretch-section">
      <div class="stretch-title">🤸 Estiramientos recomendados</div>
      <ul class="stretch-list">${items}</ul>
      <button class="simple-toggle ${done?'done':''}" id="stretchBtn_${idx}">
        ${done ? '✓ Estiramientos hechos' : 'Marcar estiramientos como hechos'}
      </button>
    </div>`;
}

function stretchKeyFor(d){
  const cls = dayTypeClass(d);
  if(cls==='type-recuperacion') return 'recuperacion';
  if(cls==='type-wod') return 'wod';
  if(cls==='type-carrera') return 'carrera';
  return 'fuerza';
}

function weekdayIndexFromDate(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const jsDay = d.getDay();
  return jsDay === 0 ? 6 : jsDay - 1;
}

function mondayOfWeek(dateStr){
  const idx = weekdayIndexFromDate(dateStr);
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() - idx);
  return d;
}

function dayTypeClass(d){
  if(d.simple){
    if(d.name.toLowerCase().includes('recuper')) return 'type-recuperacion';
    return 'type-carrera';
  }
  return 'type-fuerza';
}

  const n = d.name.toLowerCase();
  if(n.includes('recuper')) return '🧘';
  if(n.includes('wod') || n.includes('metcon')) return '🔥';
  if(n.includes('carrera')) return '🏃';
  return '🏋️';
}

async function dayIsDone(dateKey, phase, idx, dayDef){
  const log = await loadLog(dateKey);
  if(dayDef.simple){
    return !!(log[`p${phase}_d${idx}`] && log[`p${phase}_d${idx}`].done);
  }
  return dayDef.exercises.length>0 && dayDef.exercises.every(ex=> log[ex.id] && log[ex.id].done);
}

function hasLoggedValue(v){
  if(!v || typeof v !== 'object') return false;
  return Object.keys(v).some(k=> k!=='done' && v[k]);
}

async function dayHasActivity(dateKey){
  const log = await loadLog(dateKey);
  return Object.entries(log).some(([k,v])=>{
    if(k.startsWith('customlist_') || k.startsWith('comment_')) return false;
    if(!v || typeof v !== 'object') return false;
    return v.done || hasLoggedValue(v);
  });
}

async function currentStreak(){
  let streak = 0;
  let d = todayStr();
  for(let i=0;i<60;i++){
    const has = await dayHasActivity(d);
    if(has){ streak++; d = daysAgoStr(i+1); }
    else if(i===0){ d = daysAgoStr(1); continue; }
    else break;
  }
  return streak;
}

async function renderSummary(){
  const row = document.getElementById('summaryRow');
  const monday = mondayOfWeek(currentDate);
  let completed = 0;
  for(let i=0;i<7;i++){
    const d = new Date(monday);
    d.setDate(d.getDate()+i);
    const dateKey = d.toISOString().slice(0,10);
    if(dateKey <= todayStr()){
      if(await dayHasActivity(dateKey)) completed++;
    }
  }

  const weights = await getAllWeights();
  let weightHtml = '<span class="summary-value small">—</span>';
  if(weights.length>0){
    const last = weights[0];
    let deltaHtml = '';
    if(weights.length>1){
      const diff = (parseFloat(last.kg) - parseFloat(weights[1].kg));
      const sign = diff>0?'+':'';
      const cls = diff>0?'delta-up':(diff<0?'delta-down':'');
      deltaHtml = `<span class="summary-delta ${cls}">${sign}${diff.toFixed(1)}</span>`;
    }
    weightHtml = `<span class="summary-value">${last.kg} kg</span>${deltaHtml}`;
  }

  const todayDone = await dayHasActivity(todayStr());

  row.innerHTML = `
    <div class="summary-card">
      <div class="summary-label">Hoy</div>
      <div class="summary-value ${todayDone?'':'small'}" style="${todayDone?'color:var(--green);':''}">${todayDone ? '✓ Hecho' : 'Pendiente'}</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Esta semana</div>
      <div class="summary-value">${completed}/7</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Último peso</div>
      <div>${weightHtml}</div>
    </div>
  `;

  const streak = await currentStreak();
  const pill = document.getElementById('streakPill');
  if(streak>0){
    pill.style.display = 'inline-flex';
    pill.innerHTML = `🔥 Racha de ${streak} día${streak===1?'':'s'}`;
  } else {
    pill.style.display = 'none';
  }
}

function fieldsForMode(mode){
  switch(mode){
    case 'unilateral':
      return [
        {key:'peso', label:'Peso (kg)', type:'number', inputmode:'decimal'},
        {key:'repsL', label:'Reps izq.', type:'text', inputmode:'text'},
        {key:'repsR', label:'Reps der.', type:'text', inputmode:'text'},
      ];
    case 'time':
      return [
        {key:'segundos', label:'Segundos (total)', type:'number', inputmode:'numeric'},
      ];
    case 'carry':
      return [
        {key:'peso', label:'Peso/mano (kg)', type:'number', inputmode:'decimal'},
        {key:'distancia', label:'Distancia (m)', type:'text', inputmode:'text'},
      ];
    default:
      return [
        {key:'peso', label:'Peso (kg)', type:'number', inputmode:'decimal'},
        {key:'reps', label:'Reps', type:'text', inputmode:'text'},
      ];
  }
}

function primaryFieldForMode(mode){
  return mode==='time' ? 'segundos' : 'peso';
}

function formatLogValue(fields, exLog){
  return fields.map(f=> exLog[f.key] ? `${exLog[f.key]}${f.key==='peso'?'kg':(f.key==='segundos'?'s':(f.key==='distancia'?'m':''))}` : null)
    .filter(Boolean).join(' · ');
}

function exerciseRowHtml(id, name, target, exLog, lastNote, mode){
  const fields = fieldsForMode(mode);
  const inputsHtml = fields.map(f=>`
    <div style="flex:1">
      <label>${f.label}</label>
      <input type="${f.type}" inputmode="${f.inputmode}" placeholder="—" data-field="${f.key}" data-exid="${id}" value="${exLog[f.key]||''}">
    </div>`).join('');
  return `
    <div class="exercise">
      <div class="ex-top">
        <div>
          <div class="ex-name">${name}</div>
          <div class="ex-target">${target}</div>
          ${lastNote ? `<div class="ex-last">${lastNote}</div>` : ''}
        </div>
        <div class="ex-check ${exLog.done?'done':''}" data-exid="${id}">${exLog.done?'✓':''}</div>
      </div>
      <div class="ex-inputs">${inputsHtml}</div>
    </div>`;
}

function dateForWeekIdx(idx){
  const monday = mondayOfWeek(currentDate);
  const d = new Date(monday);
  d.setDate(d.getDate() + idx);
  return d.toISOString().slice(0,10);
}

async function getLastExerciseLog(exId, beforeDateKey){
  try{
    const prefix = uk('log:');
    const list = await window.storage.list(prefix);
    if(!list || !list.keys) return null;
    const keys = list.keys.map(k=> k.startsWith(prefix)?k:prefix+k).filter(k=> k.replace(prefix,'') < beforeDateKey).sort().reverse();
    for(const k of keys.slice(0,30)){
      try{
        const res = await window.storage.get(k);
        if(!res) continue;
        const log = JSON.parse(res.value);
        if(log[exId] && hasLoggedValue(log[exId])) return log[exId];
      }catch(e){ continue; }
    }
  }catch(e){}
  return null;
}

async function getLastExerciseNote(exId, beforeDateKey, mode){
  const entry = await getLastExerciseLog(exId, beforeDateKey);
  if(!entry) return null;
  const val = formatLogValue(fieldsForMode(mode), entry);
  return val ? `Última vez: ${val}` : null;
}

async function getBestExerciseValue(exId, beforeDateKey, mode){
  try{
    const prefix = uk('log:');
    const list = await window.storage.list(prefix);
    if(!list || !list.keys) return null;
    const field = primaryFieldForMode(mode);
    let best = null;
    for(const k of list.keys){
      const fullKey = k.startsWith(prefix) ? k : prefix + k;
      const dateKey = fullKey.replace(prefix,'');
      if(dateKey >= beforeDateKey) continue;
      try{
        const res = await window.storage.get(fullKey);
        if(!res) continue;
        const log = JSON.parse(res.value);
        if(log[exId] && log[exId][field]){
          const v = parseFloat(log[exId][field]);
          if(!isNaN(v) && (best===null || v>best)) best = v;
        }
      }catch(e){ continue; }
    }
    return best;
  }catch(e){ return null; }
}

async function updateBadge(idx){

  badge.classList.toggle('done', done);

  for(let i=0;i<startPad;i++){

  }

  const today = todayStr();
  for(let day=1; day<=daysInMonth; day++){

    const cell = document.createElement('div');
    cell.innerHTML = `<span class="cal-num">${day}</span>`;

      cls += ' future';
    } else {

      cls += has ? ' done' : ' in-month missed';

      renderWeek();
    };

  }
}

function svgLineChart(points, opts){
  opts = opts || {};
  const w = 320, h = 140, padL = 34, padR = 10, padT = 14, padB = 22;
  if(points.length===0) return '<div class="prog-empty">Sin datos suficientes.</div>';
  if(points.length===1){
    return `<div class="prog-empty">Solo hay un registro (${points[0].y}). Necesitas al menos 2 para ver una tendencia.</div>`;
  }
  const ys = points.map(p=>p.y);
  let minY = Math.min(...ys), maxY = Math.max(...ys);
  if(minY===maxY){ minY -= 1; maxY += 1; }
  const rangeY = maxY - minY;
  const stepX = (w - padL - padR) / (points.length - 1);
  const scaleY = (v)=> h - padB - ((v - minY) / rangeY) * (h - padT - padB);
  const coords = points.map((p,i)=> [padL + i*stepX, scaleY(p.y)]);
  const linePath = coords.map((c,i)=> (i===0?'M':'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const areaPath = linePath + ` L${coords[coords.length-1][0].toFixed(1)},${h-padB} L${coords[0][0].toFixed(1)},${h-padB} Z`;
  const dots = coords.map((c,i)=> `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3" fill="var(--accent)" />`).join('');
  const firstLabel = points[0].label, lastLabel = points[points.length-1].label;
  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto;">
      <defs>
        <linearGradient id="grad1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <text x="${padL}" y="${padT-2}" fill="#9aa3b5" font-size="9">${maxY.toFixed(1)}</text>
      <text x="${padL}" y="${h-padB+2}" fill="#9aa3b5" font-size="9" dominant-baseline="hanging">${minY.toFixed(1)}</text>
      <path d="${areaPath}" fill="url(#grad1)" />
      <path d="${linePath}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
      <text x="${padL}" y="${h-4}" fill="#5d6474" font-size="9">${firstLabel}</text>
      <text x="${w-padR}" y="${h-4}" fill="#5d6474" font-size="9" text-anchor="end">${lastLabel}</text>
    </svg>`;
}

function svgBarChart(bars, opts){
  opts = opts || {};
  const w = 320, h = 130, padL = 8, padR = 8, padT = 16, padB = 22;
  if(bars.length===0) return '<div class="prog-empty">Sin datos suficientes.</div>';
  const barW = (w - padL - padR) / bars.length * 0.62;
  const gap = (w - padL - padR) / bars.length;
  const maxV = opts.maxV || Math.max(...bars.map(b=>b.value), 1);
  const bodyH = h - padT - padB;
  const rects = bars.map((b,i)=>{
    const x = padL + i*gap + (gap-barW)/2;
    const bh = maxV>0 ? (b.value/maxV) * bodyH : 0;
    const y = padT + (bodyH - bh);
    const color = opts.flat ? 'var(--accent)' : (b.value>=85 ? 'var(--green)' : (b.value>=50 ? 'var(--accent)' : 'var(--amber)'));
    const valueLabel = opts.showValue && b.value>0 ? `<text x="${(x+barW/2).toFixed(1)}" y="${(y-3).toFixed(1)}" fill="#9aa3b5" font-size="8" text-anchor="middle">${b.value}</text>` : '';
    return `${valueLabel}<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="${color}"/>
      <text x="${(x+barW/2).toFixed(1)}" y="${h-6}" fill="#5d6474" font-size="8.5" text-anchor="middle">${b.label}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto;">${rects}</svg>`;
}

async function collectAllLogs(){
  const prefix = uk('log:');
  const list = await window.storage.list(prefix);
  const results = [];
  if(!list || !list.keys) return results;
  const keys = [...list.keys].sort().reverse();
  for(const k of keys){
    const fullKey = k.startsWith(prefix) ? k : prefix + k;
    const dateKey = fullKey.replace(prefix,'');
    try{
      const res = await window.storage.get(fullKey);
      if(!res) continue;
      const log = JSON.parse(res.value);
      results.push({ dateKey, log });
    }catch(e){
      continue;
    }
  }
  return results;
}

function exModeFromId(id){
  for(const phase of Object.values(plan())){
    for(const day of phase.days){
      if(day.exercises){
        const found = day.exercises.find(e=>e.id===id);
        if(found) return found.mode;
      }
    }
  }
  return undefined;
}

function exNameFromId(id, log){
  if(id.startsWith('custom_') && log){
    for(const [k,v] of Object.entries(log)){
      if(k.startsWith('customlist_') && Array.isArray(v)){
        const found = v.find(e=>e.id===id);
        if(found) return found.name;
      }
    }
  }
  for(const phase of Object.values(plan())){
    for(const day of phase.days){
      if(day.exercises){
        const found = day.exercises.find(e=>e.id===id);
        if(found) return found.name;
      }
    }
  }
  return id;
}

async function buildExerciseSeries(){
  const all = await collectAllLogs();
  const chrono = [...all].reverse();
  const byName = {};
  chrono.forEach(({dateKey, log})=>{
    Object.entries(log).forEach(([key,val])=>{
      if(key.startsWith('customlist_') || key.startsWith('comment_')) return;
      if(key.startsWith('p') && key.includes('_d')) return;
      if(!val || typeof val !== 'object') return;
      const mode = exModeFromId(key);
      const field = primaryFieldForMode(mode);
      const raw = val[field];
      const num = parseFloat(raw);
      if(isNaN(num)) return;
      const name = exNameFromId(key, log);
      if(!byName[name]) byName[name] = { mode, points: [] };
      byName[name].points.push({ x:dateKey, y:num, label: formatDateShort(dateKey) });
    });
  });
  return byName;
}

function formatDateShort(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('es-ES', { day:'numeric', month:'short' });
}

async function getKmSeries(){
  const all = await collectAllLogs();
  const chrono = [...all].reverse();
  const points = [];
  chrono.forEach(({dateKey, log})=>{
    Object.entries(log).forEach(([key,val])=>{
      if(/^p\d+_d\d+$/.test(key) && val && val.km){
        const km = parseFloat(val.km);
        if(!isNaN(km)) points.push({ date:dateKey, km });
      }
    });
  });
  return points;
}

function sumKmInRange(series, startStr, endStr){
  return series.filter(p=> p.date>=startStr && p.date<=endStr).reduce((s,p)=> s+p.km, 0);
}

async function kmThisWeek(){
  const series = await getKmSeries();
  const monday = mondayOfWeek(todayStr());
  const mondayStr = monday.toISOString().slice(0,10);
  return Math.round(sumKmInRange(series, mondayStr, todayStr()) * 10) / 10;
}

async function renderProgress(){
  const container = document.getElementById('progView');
  container.innerHTML = '<div class="prog-empty">Cargando...</div>';

  const weights = await getAllWeights();
  const weightPoints = [...weights].reverse().map(w=> ({ x:w.dateKey, y:parseFloat(w.kg), label: formatDateShort(w.dateKey) }));

  const exSeries = await buildExerciseSeries();
  const names = Object.keys(exSeries).filter(n=> exSeries[n].points.length>=1).sort((a,b)=> exSeries[b].points.length - exSeries[a].points.length);
  if(!progSelectedName || !names.includes(progSelectedName)){
    progSelectedName = names[0] || null;
  }

  const monday = mondayOfWeek(todayStr());
  const weeklyBars = [];
  for(let w=7; w>=0; w--){
    const start = new Date(monday);
    start.setDate(start.getDate() - w*7);
    let count = 0;
    for(let i=0;i<7;i++){
      const d = new Date(start);
      d.setDate(d.getDate()+i);
      const dateKey = d.toISOString().slice(0,10);
      if(dateKey <= todayStr() && await dayHasActivity(dateKey)) count++;
    }
    weeklyBars.push({ label: `${start.getDate()}/${start.getMonth()+1}`, value: Math.round(count/7*100) });
  }

  const kmSeries = await getKmSeries();
  const weeklyKmBars = [];
  for(let w=7; w>=0; w--){
    const start = new Date(monday);
    start.setDate(start.getDate() - w*7);
    const startStr = start.toISOString().slice(0,10);
    const end = new Date(start); end.setDate(end.getDate()+6);
    const endStr = end.toISOString().slice(0,10);
    const total = Math.round(sumKmInRange(kmSeries, startStr, endStr) * 10) / 10;
    weeklyKmBars.push({ label: `${start.getDate()}/${start.getMonth()+1}`, value: total });
  }

  let html = '';

  html += `
    <div class="prog-card">
      <div class="prog-title">Peso corporal</div>
      <div class="prog-sub">Evolución de tus registros</div>
      ${svgLineChart(weightPoints)}
    </div>`;

  html += `
    <div class="prog-card">
      <div class="prog-title">Constancia semanal</div>
      <div class="prog-sub">% de días con sesión registrada, últimas 8 semanas</div>
      ${svgBarChart(weeklyBars, {maxV:100})}
    </div>`;

  html += `
    <div class="prog-card">
      <div class="prog-title">Kilómetros corridos por semana</div>
      <div class="prog-sub">Rumbo al trail del 4 de octubre</div>
      ${svgBarChart(weeklyKmBars, {flat:true, showValue:true})}
    </div>`;

  html += await renderComparativaCard();

  if(names.length>0){
    const options = names.map(n=> `<option value="${n}" ${n===progSelectedName?'selected':''}>${n}</option>`).join('');
    const series = exSeries[progSelectedName];
    const unit = series.mode==='time' ? 's' : 'kg';
    let deltaHtml = '';
    if(series.points.length>=2){
      const diff = series.points[series.points.length-1].y - series.points[0].y;
      const sign = diff>0?'+':'';
      deltaHtml = `<div class="chart-delta">${sign}${diff.toFixed(1)}${unit} desde el primer registro</div>`;
    }
    html += `
      <div class="prog-card">
        <div class="prog-title">Progresión por ejercicio</div>
        <div class="prog-sub">Selecciona un ejercicio para ver su evolución</div>
        <select class="ex-select" id="progExSelect">${options}</select>
        ${svgLineChart(series.points)}
        ${deltaHtml}
      </div>`;
  }

  container.innerHTML = html;

  if(names.length>0){
    document.getElementById('progExSelect').onchange = (e)=>{
      progSelectedName = e.target.value;
      renderProgress();
    };
  }
}

async function getAllWeights(){
  try{
    const prefix = uk('weight:');
    const list = await window.storage.list(prefix);
    if(!list || !list.keys) return [];
    const keys = [...list.keys].sort().reverse();
    const out = [];
    for(const k of keys){
      const fullKey = k.startsWith(prefix) ? k : prefix + k;
      const dateKey = fullKey.replace(prefix,'');
      try{
        const res = await window.storage.get(fullKey);
        if(res) out.push({ dateKey, kg: res.value });
      }catch(e){ continue; }

/* ---------- HISTORIAL / EXPORT ---------- */

async function renderHistory(){
  const container = document.getElementById('historyList');
  container.innerHTML = '<div class="hist-empty">Cargando...</div>';
  try{
    const all = await collectAllLogs();
    if(all.length===0){
      container.innerHTML = '<div class="hist-empty">Aún no hay sesiones registradas.</div>';
      return;
    }
    let html = `<button class="export-btn" id="exportBtn">Copiar historial para Claude</button><div class="export-box" id="exportBox"></div>`;
    let any = false;
    all.slice(0,30).forEach(({dateKey, log})=>{
      const entries = Object.entries(log);
      if(entries.length===0) return;
      let lines = '';
      entries.forEach(([key,val])=>{
        if(key.startsWith('customlist_')) return;
        if(key.startsWith('comment_')){
          if(val && val.trim()) lines += `<div class="hist-line"><span style="font-style:italic;">"${val}"</span><span></span></div>`;
        } else if(key.startsWith('stretch_')){
          if(val && val.done) lines += `<div class="hist-line"><span>Estiramientos</span><span>✓</span></div>`;
        } else if(key.startsWith('p') && key.includes('_d')){
          if(val && val.done){
            const kmTxt = val.km ? ` · ${val.km} km${val.ritmo ? ' · '+val.ritmo+' min/km' : ''}` : '';
            lines += `<div class="hist-line"><span>Sesión completada${kmTxt}</span><span>✓</span></div>`;
          }
        } else {
          if(val && (val.done || hasLoggedValue(val))){
            const valText = formatLogValue(fieldsForMode(exModeFromId(key)), val);
            lines += `<div class="hist-line"><span>${exNameFromId(key, log)}</span><span>${valText}</span></div>`;
          }
        }
      });
      if(lines){
        any = true;
        html += `<div class="hist-item"><div class="hist-date">${formatDate(dateKey)}</div>${lines}</div>`;
      }
    });
    container.innerHTML = any ? html : '<div class="hist-empty">Aún no hay sesiones registradas.</div>';

    document.getElementById('exportBtn').onclick = async ()=>{
      const text = await buildExportText(all);
      const box = document.getElementById('exportBox');
      box.textContent = text;
      box.style.display = 'block';
      try{
        await navigator.clipboard.writeText(text);
        document.getElementById('exportBtn').textContent = 'Copiado — pégalo en el chat';
      }catch(e){
        document.getElementById('exportBtn').textContent = 'Selecciona y copia el texto de abajo';
      }
    };
  }catch(e){
    container.innerHTML = '<div class="hist-empty">No se pudo cargar el historial.</div>';
  }
}

async function buildExportText(all){
  let out = 'Registro de entrenamientos:\n\n';
  const weights = await getAllWeights();
  if(weights.length>0){
    out += 'Peso corporal:\n';
    weights.slice(0,20).reverse().forEach(w=>{
      out += `  ${w.dateKey}: ${w.kg} kg\n`;
    });
    out += '\n';
  }
  all.forEach(({dateKey, log})=>{
    const entries = Object.entries(log).filter(([k,v])=> v && (v.done || hasLoggedValue(v) || (typeof v === 'string' && v.trim())));
    if(entries.length===0) return;
    out += `${dateKey}\n`;
    entries.forEach(([key,val])=>{
      if(key.startsWith('customlist_')) return;
      if(key.startsWith('comment_')){
        if(val && val.trim()) out += `  Comentario: ${val}\n`;
      } else if(key.startsWith('stretch_')){
        if(val.done) out += `  Estiramientos: hechos\n`;
      } else if(key.startsWith('p') && key.includes('_d')){
        if(val.done){
          const kmTxt = val.km ? ` (${val.km} km${val.ritmo ? ', '+val.ritmo+' min/km' : ''})` : '';
          out += `  Sesión marcada como completada${kmTxt}\n`;
        }
      } else {
        const valText = formatLogValue(fieldsForMode(exModeFromId(key)), val);
        out += `  ${exNameFromId(key, log)}: ${valText}${val.done?' (hecho)':''}\n`;
      }
    });
    out += '\n';
  });
  return out;
}

function formatDate(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long' });
}

function backupAllData(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    data[k] = localStorage.getItem(k);
  }
  return data;
}

function downloadBackup(){
  const data = backupAllData();
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `entrenamiento-backup-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function restoreBackupFile(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      Object.entries(data).forEach(([k,v])=> localStorage.setItem(k, v));
      alert('Copia restaurada correctamente. La app se va a recargar.');
      location.reload();
    }catch(err){
      alert('El archivo no es una copia de seguridad válida.');
    }
  };
  reader.readAsText(file);
}

document.getElementById('backupDownloadBtn').onclick = downloadBackup;
document.getElementById('backupRestoreBtn').onclick = ()=> document.getElementById('backupFileInput').click();
document.getElementById('backupFileInput').addEventListener('change', (e)=>{
  if(e.target.files[0]) restoreBackupFile(e.target.files[0]);
});

document.getElementById('datePicker').addEventListener('change', (e)=>{
  currentDate = e.target.value;
  renderWeek();
});

  await seedBorjaHistory();
  buildPhaseRow();
  goToday();
}
