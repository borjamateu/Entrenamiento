<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Plan de entrenamiento</title>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --card2:#20242c; --border:#2c313c;
    --text:#eef0f3; --text2:#9aa2b1; --muted:#5f6675;
    --accent:#4f8cff; --accent2:#1e3a66;
    --green:#39c07a; --greenbg:#12261c;
    --red:#e0596a; --redbg:#2a1418;
    --amber:#e0a733;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-bottom:40px;
  }
  header{
    padding:18px 16px 12px; position:sticky; top:0; background:var(--bg);
    z-index:10; border-bottom:0.5px solid var(--border);
  }
  h1{font-size:18px; font-weight:600; margin:0 0 2px;}
  .sub{font-size:13px; color:var(--text2); margin:0;}

  .summary-row{display:flex; gap:8px; padding:12px 16px 0;}
  .summary-card{
    flex:1; background:var(--card); border:0.5px solid var(--border); border-radius:12px;
    padding:10px 12px;
  }
  .summary-label{font-size:11px; color:var(--muted); margin-bottom:3px;}
  .summary-value{font-size:18px; font-weight:600;}
  .summary-value.small{font-size:14px; font-weight:500;}
  .summary-delta{font-size:11.5px; margin-left:4px;}
  .delta-down{color:var(--green);}
  .delta-up{color:var(--red);}

  .phase-row{display:flex; gap:8px; padding:14px 16px 0;}
  .phase-btn{
    flex:1; padding:9px 4px; text-align:center; border-radius:10px;
    border:0.5px solid var(--border); background:var(--card); color:var(--text2);
    font-size:13px; font-weight:500;
  }
  .phase-btn.active{background:var(--accent2); border-color:var(--accent); color:#cfe0ff;}

  .week{padding:14px 16px 4px; display:flex; flex-direction:column; gap:8px;}

  .day-card{
    background:var(--card); border:0.5px solid var(--border); border-radius:var(--radius);
    overflow:hidden;
  }
  .day-card.is-today{border-color:var(--accent);}
  .day-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px; cursor:pointer;
  }
  .day-left{display:flex; flex-direction:column; gap:2px;}
  .day-name{font-size:15px; font-weight:600;}
  .day-focus{font-size:12.5px; color:var(--text2);}
  .day-right{display:flex; align-items:center; gap:8px;}
  .day-dur{font-size:12px; color:var(--muted);}
  .check-badge{
    width:26px; height:26px; border-radius:50%; border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--muted);
    flex-shrink:0;
  }
  .check-badge.done{background:var(--green); border-color:var(--green); color:#08301a;}
  .today-dot{width:6px; height:6px; border-radius:50%; background:var(--accent); flex-shrink:0;}

  .day-body{display:none; padding:0 14px 16px; border-top:0.5px solid var(--border);}
  .day-body.open{display:block;}

  .exercise{padding:12px 0; border-bottom:0.5px solid var(--border);}
  .exercise:last-child{border-bottom:none;}
  .ex-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .ex-name{font-size:14px; font-weight:500;}
  .ex-target{font-size:12px; color:var(--text2); margin-top:2px;}
  .ex-last{font-size:11.5px; color:var(--accent); margin-top:2px;}
  .ex-check{
    width:28px; height:28px; border-radius:50%; border:1.5px solid var(--border);
    flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--muted);
  }
  .ex-check.done{background:var(--green); border-color:var(--green); color:#08301a;}

  .ex-inputs{display:flex; gap:8px; margin-top:8px;}
  .ex-inputs input{
    flex:1; background:var(--card2); border:0.5px solid var(--border); border-radius:8px;
    color:var(--text); font-size:14px; padding:9px 10px; width:100%;
  }
  .ex-inputs input::placeholder{color:var(--muted);}
  .ex-inputs label{font-size:10.5px; color:var(--muted); display:block; margin-bottom:3px;}

  .simple-toggle{
    margin-top:6px; display:inline-flex; align-items:center; gap:6px;
    font-size:13px; color:var(--text2); padding:9px 14px; border-radius:8px;
    border:0.5px solid var(--border); background:var(--card2);
  }
  .simple-toggle.done{color:#8fe8b6; border-color:var(--green); background:var(--greenbg);}

  .save-row{margin-top:14px;}
  .save-btn{
    width:100%; padding:12px; border-radius:10px; border:none; background:var(--accent);
    color:white; font-size:14px; font-weight:600;
  }
  .save-btn:active{opacity:0.85;}
  .saved-note{font-size:12px; color:var(--green); text-align:center; margin-top:8px; display:none;}

  .footer-nav{display:flex; gap:6px; padding:18px 16px 6px;}
  .nav-btn{
    flex:1; padding:11px 2px; text-align:center; border-radius:10px; border:0.5px solid var(--border);
    background:var(--card); color:var(--text2); font-size:12.5px; font-weight:500;
  }
  .nav-btn.active{color:var(--text); border-color:var(--accent);}

  .history{padding:4px 16px 20px;}
  .hist-item{
    background:var(--card); border:0.5px solid var(--border); border-radius:12px;
    padding:12px 14px; margin-bottom:8px;
  }
  .hist-date{font-size:13px; font-weight:600; margin-bottom:6px;}
  .hist-line{font-size:12.5px; color:var(--text2); display:flex; justify-content:space-between; padding:2px 0;}
  .hist-empty{color:var(--muted); font-size:13px; text-align:center; padding:30px 0;}

  .date-picker-row{padding:10px 16px 0; display:flex; align-items:center; gap:8px;}
  .date-picker-row input[type=date]{
    background:var(--card2); border:0.5px solid var(--border); border-radius:8px;
    color:var(--text); font-size:13px; padding:8px 10px; flex:1;
  }
  .today-btn{font-size:12px; color:var(--accent); padding:8px 10px; border:0.5px solid var(--border); border-radius:8px; background:var(--card2);}

  .comment-box{margin-top:10px;}
  .comment-box label{font-size:10.5px; color:var(--muted); display:block; margin-bottom:3px;}
  .comment-box textarea{
    width:100%; background:var(--card2); border:0.5px solid var(--border); border-radius:8px;
    color:var(--text); font-size:13.5px; padding:9px 10px; min-height:44px; resize:vertical;
    font-family:inherit;
  }
  .add-ex-btn{
    width:100%; margin-top:6px; padding:10px; border-radius:8px; border:1px dashed var(--border);
    background:transparent; color:var(--text2); font-size:13px;
  }
  .custom-ex-name{
    width:100%; background:var(--card2); border:0.5px solid var(--border); border-radius:8px;
    color:var(--text); font-size:14px; padding:9px 10px; margin-bottom:6px;
  }
  .export-btn{
    width:100%; padding:12px; border-radius:10px; border:0.5px solid var(--accent); background:transparent;
    color:var(--accent); font-size:13.5px; font-weight:600; margin-bottom:14px;
  }
  .export-box{
    background:var(--card2); border:0.5px solid var(--border); border-radius:10px; padding:10px;
    font-size:11.5px; color:var(--text2); white-space:pre-wrap; max-height:200px; overflow-y:auto; margin-bottom:14px;
    display:none;
  }

  .weight-view{padding:14px 16px 20px;}
  .weight-form{
    display:flex; gap:8px; background:var(--card); border:0.5px solid var(--border);
    border-radius:12px; padding:12px; margin-bottom:14px;
  }
  .weight-form input[type=date]{
    background:var(--card2); border:0.5px solid var(--border); border-radius:8px;
    color:var(--text); font-size:13px; padding:9px 8px; width:118px;
  }
  .weight-form input[type=number]{
    flex:1; background:var(--card2); border:0.5px solid var(--border); border-radius:8px;
    color:var(--text); font-size:15px; padding:9px 10px;
  }
  .weight-form button{
    padding:9px 14px; border-radius:8px; border:none; background:var(--accent); color:white; font-size:13px; font-weight:600;
  }
  .weight-row{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--card); border:0.5px solid var(--border); border-radius:10px;
    padding:11px 14px; margin-bottom:6px;
  }
  .weight-date{font-size:13px; color:var(--text2);}
  .weight-kg{font-size:15px; font-weight:600;}
  .weight-del{color:var(--muted); font-size:12px; padding:4px 8px;}
</style>
</head>
<body>

<header>
  <h1>Plan de entrenamiento</h1>
  <p class="sub" id="subtitle">Fuerza + carrera + base CrossFit</p>
</header>

<div class="summary-row" id="summaryRow"></div>

<div id="planTabContent">
  <div class="date-picker-row">
    <input type="date" id="datePicker">
    <button class="today-btn" onclick="goToday()">Hoy</button>
  </div>

  <div class="phase-row" id="phaseRow"></div>

  <div id="planView">
    <div class="week" id="weekList"></div>
  </div>
</div>

<div id="historyView" class="history" style="display:none;"></div>

<div id="weightView" class="weight-view" style="display:none;">
  <div class="weight-form">
    <input type="date" id="weightDate">
    <input type="number" inputmode="decimal" step="0.1" id="weightKg" placeholder="kg">
    <button id="weightSaveBtn">Guardar</button>
  </div>
  <div id="weightList"></div>
</div>

<div class="footer-nav">
  <button class="nav-btn active" id="navPlan" onclick="switchView('plan')">Plan</button>
  <button class="nav-btn" id="navWeight" onclick="switchView('weight')">Peso</button>
  <button class="nav-btn" id="navHistory" onclick="switchView('history')">Historial</button>
</div>

<script>
const PLAN = {
  1: {
    label: "Fase 1 · Reacondicionamiento",
    days: [
      { day:"Lunes", name:"Fuerza A (Full body)", dur:"45-50 min", focus:"Técnica + volumen moderado",
        exercises:[
          {id:"f1_lu_1", name:"Sentadilla trasera", target:"3×8 @ RPE 6"},
          {id:"f1_lu_2", name:"Press banca", target:"3×8 @ RPE 6"},
          {id:"f1_lu_3", name:"Remo con barra", target:"3×10"},
          {id:"f1_lu_4", name:"Peso muerto rumano", target:"2×10"},
          {id:"f1_lu_5", name:"Plancha", target:"3×30-40s"},
        ]},
      { day:"Martes", name:"Carrera suave", dur:"30-40 min", focus:"Z2, rodar", simple:true },
      { day:"Miércoles", name:"Fuerza B (Full body)", dur:"45-50 min", focus:"Técnica + volumen moderado",
        exercises:[
          {id:"f1_mi_1", name:"Peso muerto convencional", target:"3×6 @ RPE 6"},
          {id:"f1_mi_2", name:"Press militar mancuernas", target:"3×8"},
          {id:"f1_mi_3", name:"Dominadas asistidas / remo polea", target:"3×8-10"},
          {id:"f1_mi_4", name:"Zancadas con mancuerna", target:"2×10/pierna"},
          {id:"f1_mi_5", name:"Kettlebell swing", target:"3×15"},
        ]},
      { day:"Jueves", name:"Carrera suave + core", dur:"30-35 min", focus:"Z2 + 10 min core", simple:true },
      { day:"Viernes", name:"Fuerza C (Full body)", dur:"45-50 min", focus:"Técnica + volumen moderado",
        exercises:[
          {id:"f1_vi_1", name:"Sentadilla frontal / goblet", target:"3×8"},
          {id:"f1_vi_2", name:"Press inclinado mancuernas", target:"3×10"},
          {id:"f1_vi_3", name:"Face pull en polea", target:"3×15"},
          {id:"f1_vi_4", name:"Hip thrust", target:"3×10"},
          {id:"f1_vi_5", name:"Farmer carry", target:"3×30m"},
        ]},
      { day:"Sábado", name:"Carrera larga suave", dur:"40-60 min", focus:"Z2, sin reloj de ritmo", simple:true },
      { day:"Domingo", name:"Recuperación activa", dur:"20-30 min", focus:"Movilidad + remo/bici muy suave", simple:true },
    ]
  },
  2: {
    label: "Fase 2 · Construcción",
    days: [
      { day:"Lunes", name:"Fuerza A (Empuje/pierna)", dur:"50-60 min", focus:"Fuerza, RPE 7",
        exercises:[
          {id:"f2_lu_1", name:"Sentadilla trasera", target:"RPE 7, subir carga"},
          {id:"f2_lu_2", name:"Press banca", target:"RPE 7"},
          {id:"f2_lu_3", name:"Press militar", target:"3×8"},
          {id:"f2_lu_4", name:"Zancadas", target:"3×10/pierna"},
        ]},
      { day:"Martes", name:"Carrera calidad (series)", dur:"35-40 min", focus:"6×400m ritmo rápido, rec. 90s", simple:true },
      { day:"Miércoles", name:"Fuerza B (Tirón/pierna)", dur:"50-60 min", focus:"Fuerza, RPE 7",
        exercises:[
          {id:"f2_mi_1", name:"Peso muerto convencional", target:"RPE 7"},
          {id:"f2_mi_2", name:"Dominadas / remo polea", target:"3×8-10"},
          {id:"f2_mi_3", name:"Hip thrust", target:"3×10"},
          {id:"f2_mi_4", name:"Face pull", target:"3×15"},
        ]},
      { day:"Jueves", name:"Carrera suave + core", dur:"30-35 min", focus:"Z2", simple:true },
      { day:"Viernes", name:"Full body / metcon corto", dur:"40-45 min", focus:"AMRAP 12-15 min: KB swing, dominadas, air squat, remo", simple:true },
      { day:"Sábado", name:"Carrera larga", dur:"45-70 min", focus:"Z2, subiendo volumen", simple:true },
      { day:"Domingo", name:"Recuperación activa", dur:"20-30 min", focus:"Movilidad", simple:true },
    ]
  },
  3: {
    label: "Fase 3 · Intensificación / pre-CrossFit",
    days: [
      { day:"Lunes", name:"Fuerza pesada (piernas)", dur:"50-60 min", focus:"RPE 8, bajo volumen alta carga",
        exercises:[
          {id:"f3_lu_1", name:"Sentadilla trasera", target:"RPE 8"},
          {id:"f3_lu_2", name:"Peso muerto rumano", target:"3×8"},
          {id:"f3_lu_3", name:"Zancadas búlgaras", target:"3×8/pierna"},
        ]},
      { day:"Martes", name:"Carrera calidad (tempo)", dur:"35-40 min", focus:"Ritmo umbral", simple:true },
      { day:"Miércoles", name:"Fuerza pesada (torso)", dur:"50-60 min", focus:"RPE 8",
        exercises:[
          {id:"f3_mi_1", name:"Press banca", target:"RPE 8"},
          {id:"f3_mi_2", name:"Dominadas lastradas", target:"3×6-8"},
          {id:"f3_mi_3", name:"Press militar", target:"3×8"},
        ]},
      { day:"Jueves", name:"Carrera suave + core", dur:"30 min", focus:"Z2", simple:true },
      { day:"Viernes", name:"WOD estilo CrossFit", dur:"30-40 min", focus:"AMRAP/EMOM con más intensidad", simple:true },
      { day:"Sábado", name:"Carrera larga", dur:"50-75 min", focus:"Z2", simple:true },
      { day:"Domingo", name:"Recuperación activa", dur:"20-30 min", focus:"Movilidad", simple:true },
    ]
  }
};

let currentPhase = 1;
let currentDate = new Date().toISOString().slice(0,10);

function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysAgoStr(n){
  const d = new Date();
  d.setDate(d.getDate()-n);
  return d.toISOString().slice(0,10);
}

function goToday(){
  currentDate = todayStr();
  document.getElementById('datePicker').value = currentDate;
  renderWeek();
}

async function loadLog(dateKey){
  try{
    const res = await window.storage.get('log:' + dateKey);
    return res ? JSON.parse(res.value) : {};
  }catch(e){
    return {};
  }
}

async function saveLog(dateKey, data){
  try{
    await window.storage.set('log:' + dateKey, JSON.stringify(data));
  }catch(e){
    console.error('storage error', e);
  }
}

function buildPhaseRow(){
  const row = document.getElementById('phaseRow');
  row.innerHTML = '';
  [1,2,3].forEach(p=>{
    const b = document.createElement('button');
    b.className = 'phase-btn' + (p===currentPhase?' active':'');
    b.textContent = 'Fase ' + p;
    b.onclick = ()=>{ currentPhase = p; buildPhaseRow(); renderWeek(); };
    row.appendChild(b);
  });
  document.getElementById('subtitle').textContent = PLAN[currentPhase].label;
}

function weekdayIndexFromDate(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const jsDay = d.getDay();
  return jsDay === 0 ? 6 : jsDay - 1;
}

function mondayOfWeek(dateStr){
  const idx = weekdayIndexFromDate(dateStr);
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() - idx);
  return d;
}

async function dayIsDone(dateKey, phase, idx, dayDef){
  const log = await loadLog(dateKey);
  if(dayDef.simple){
    return !!(log[`p${phase}_d${idx}`] && log[`p${phase}_d${idx}`].done);
  }
  return dayDef.exercises.length>0 && dayDef.exercises.every(ex=> log[ex.id] && log[ex.id].done);
}

async function renderSummary(){
  const row = document.getElementById('summaryRow');
  const monday = mondayOfWeek(currentDate);
  let completed = 0;
  for(let i=0;i<7;i++){
    const d = new Date(monday);
    d.setDate(d.getDate()+i);
    const dateKey = d.toISOString().slice(0,10);
    const dayDef = PLAN[currentPhase].days[i];
    if(dateKey <= todayStr()){
      if(await dayIsDone(dateKey, currentPhase, i, dayDef)) completed++;
    }
  }

  const weights = await getAllWeights();
  let weightHtml = '<span class="summary-value small">—</span>';
  if(weights.length>0){
    const last = weights[0];
    let deltaHtml = '';
    if(weights.length>1){
      const diff = (parseFloat(last.kg) - parseFloat(weights[1].kg));
      const sign = diff>0?'+':'';
      const cls = diff>0?'delta-up':(diff<0?'delta-down':'');
      deltaHtml = `<span class="summary-delta ${cls}">${sign}${diff.toFixed(1)}</span>`;
    }
    weightHtml = `<span class="summary-value">${last.kg} kg</span>${deltaHtml}`;
  }

  row.innerHTML = `
    <div class="summary-card">
      <div class="summary-label">Esta semana</div>
      <div class="summary-value">${completed}/7</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Último peso</div>
      <div>${weightHtml}</div>
    </div>
  `;
}

async function renderWeek(){
  await renderSummary();
  const container = document.getElementById('weekList');
  container.innerHTML = '';
  const days = PLAN[currentPhase].days;
  const todayIdx = weekdayIndexFromDate(currentDate);

  for(let i=0;i<days.length;i++){
    const d = days[i];
    const card = document.createElement('div');
    card.className = 'day-card' + (i===todayIdx && currentDate===todayStr() ? ' is-today' : '');

    const head = document.createElement('div');
    head.className = 'day-head';
    head.innerHTML = `
      <div class="day-left">
        <div class="day-name">${d.day} · ${d.name}</div>
        <div class="day-focus">${d.focus}</div>
      </div>
      <div class="day-right">
        <span class="day-dur">${d.dur}</span>
        ${i===todayIdx && currentDate===todayStr() ? '<div class="today-dot"></div>' : ''}
        <div class="check-badge" id="badge_${currentPhase}_${i}"></div>
      </div>`;
    const body = document.createElement('div');
    body.className = 'day-body';
    body.id = `body_${currentPhase}_${i}`;

    head.onclick = ()=>{
      body.classList.toggle('open');
    };

    if(i===todayIdx){ body.classList.add('open'); }

    card.appendChild(head);
    card.appendChild(body);
    container.appendChild(card);

    renderDayBody(d, i);
  }
}

async function renderDayBody(d, idx){
  const body = document.getElementById(`body_${currentPhase}_${idx}`);
  const dateKey = currentDate;
  const log = await loadLog(dateKey);
  const dayLogKey = `p${currentPhase}_d${idx}`;
  const customListKey = `customlist_${dayLogKey}`;
  const customList = log[customListKey] || [];
  const commentKey = `comment_${dayLogKey}`;
  const commentVal = log[commentKey] || '';

  if(d.simple){
    const done = !!(log[dayLogKey] && log[dayLogKey].done);
    body.innerHTML = `
      <button class="simple-toggle ${done?'done':''}" id="simpleBtn_${idx}">
        ${done ? '✓ Sesión completada' : 'Marcar como hecha'}
      </button>
      <div class="comment-box">
        <label>Comentario / sensaciones</label>
        <textarea id="comment_${idx}" placeholder="Ritmo, sensación, molestias...">${commentVal}</textarea>
      </div>
      <div class="save-row"><button class="save-btn" id="saveBtn_${idx}">Guardar</button><div class="saved-note" id="savedNote_${idx}">Guardado</div></div>
    `;
    document.getElementById(`simpleBtn_${idx}`).onclick = (e)=>{
      e.target.classList.toggle('done');
      e.target.textContent = e.target.classList.contains('done') ? '✓ Sesión completada' : 'Marcar como hecha';
    };
    document.getElementById(`saveBtn_${idx}`).onclick = async ()=>{
      const l = await loadLog(dateKey);
      const btn = document.getElementById(`simpleBtn_${idx}`);
      l[dayLogKey] = { done: btn.classList.contains('done') };
      l[commentKey] = document.getElementById(`comment_${idx}`).value;
      await saveLog(dateKey, l);
      const note = document.getElementById(`savedNote_${idx}`);
      note.style.display = 'block';
      setTimeout(()=>{ note.style.display = 'none'; }, 1800);
      updateBadge(idx);
      renderSummary();
    };
  } else {
    let html = '';
    for(const ex of d.exercises){
      const exLog = log[ex.id] || {};
      const lastNote = await getLastExerciseNote(ex.id, dateKey);
      html += exerciseRowHtml(ex.id, ex.name, ex.target, exLog, lastNote);
    }
    customList.forEach(ex=>{
      const exLog = log[ex.id] || {};
      html += exerciseRowHtml(ex.id, ex.name, 'Ejercicio añadido', exLog, null);
    });
    html += `<button class="add-ex-btn" id="addExBtn_${idx}">+ Añadir ejercicio</button>`;
    html += `
      <div class="comment-box">
        <label>Comentario / sensaciones de la sesión</label>
        <textarea id="comment_${idx}" placeholder="RPE general, molestias, cómo te sentiste...">${commentVal}</textarea>
      </div>`;
    html += `<div class="save-row"><button class="save-btn" id="saveBtn_${idx}">Guardar</button><div class="saved-note" id="savedNote_${idx}">Guardado</div></div>`;
    body.innerHTML = html;

    body.querySelectorAll('.ex-check').forEach(el=>{
      el.onclick = ()=>{
        el.classList.toggle('done');
        el.textContent = el.classList.contains('done') ? '✓' : '';
      };
    });

    document.getElementById(`addExBtn_${idx}`).onclick = ()=>{
      const wrap = document.createElement('div');
      wrap.className = 'exercise';
      wrap.innerHTML = `
        <input class="custom-ex-name" placeholder="Nombre del ejercicio" id="newExName_${idx}">
        <div class="ex-inputs">
          <div style="flex:1"><label>Peso (kg)</label><input type="number" inputmode="decimal" placeholder="—" id="newExPeso_${idx}"></div>
          <div style="flex:1"><label>Reps</label><input type="text" placeholder="—" id="newExReps_${idx}"></div>
        </div>
        <button class="add-ex-btn" id="confirmNewEx_${idx}" style="margin-top:8px;">Añadir a la sesión</button>
      `;
      document.getElementById(`addExBtn_${idx}`).replaceWith(wrap);
      document.getElementById(`confirmNewEx_${idx}`).onclick = async ()=>{
        const name = document.getElementById(`newExName_${idx}`).value.trim();
        if(!name){
          document.getElementById(`newExName_${idx}`).style.borderColor = 'var(--accent)';
          return;
        }
        const newId = `custom_${dayLogKey}_${Date.now()}`;
        const peso = document.getElementById(`newExPeso_${idx}`).value;
        const reps = document.getElementById(`newExReps_${idx}`).value;
        const l = await loadLog(dateKey);
        const list = l[customListKey] || [];
        list.push({ id:newId, name:name });
        l[customListKey] = list;
        l[newId] = { done:false, peso:peso, reps:reps };
        await saveLog(dateKey, l);
        renderDayBody(d, idx);
      };
    };

    document.getElementById(`saveBtn_${idx}`).onclick = async ()=>{
      const l = await loadLog(dateKey);
      const allEx = d.exercises.concat(customList);
      allEx.forEach(ex=>{
        const checkEl = body.querySelector(`.ex-check[data-exid="${ex.id}"]`);
        const pesoEl = body.querySelector(`input[data-field="peso"][data-exid="${ex.id}"]`);
        const repsEl = body.querySelector(`input[data-field="reps"][data-exid="${ex.id}"]`);
        if(checkEl){
          l[ex.id] = {
            done: checkEl.classList.contains('done'),
            peso: pesoEl.value,
            reps: repsEl.value
          };
        }
      });
      l[commentKey] = document.getElementById(`comment_${idx}`).value;
      l[customListKey] = customList;
      await saveLog(dateKey, l);
      const note = document.getElementById(`savedNote_${idx}`);
      note.style.display = 'block';
      setTimeout(()=>{ note.style.display = 'none'; }, 1800);
      updateBadge(idx);
      renderSummary();
    };
  }
  updateBadge(idx);
}

async function getLastExerciseNote(exId, beforeDateKey){
  try{
    const list = await window.storage.list('log:');
    if(!list || !list.keys) return null;
    const keys = list.keys.map(k=> k.startsWith('log:')?k:'log:'+k).filter(k=> k.replace('log:','') < beforeDateKey).sort().reverse();
    for(const k of keys.slice(0,14)){
      try{
        const res = await window.storage.get(k);
        if(!res) continue;
        const log = JSON.parse(res.value);
        if(log[exId] && (log[exId].peso || log[exId].reps)){
          return `Última vez: ${log[exId].peso?log[exId].peso+'kg ':''}${log[exId].reps||''}`;
        }
      }catch(e){ continue; }
    }
  }catch(e){}
  return null;
}

function exerciseRowHtml(id, name, target, exLog, lastNote){
  return `
    <div class="exercise">
      <div class="ex-top">
        <div>
          <div class="ex-name">${name}</div>
          <div class="ex-target">${target}</div>
          ${lastNote ? `<div class="ex-last">${lastNote}</div>` : ''}
        </div>
        <div class="ex-check ${exLog.done?'done':''}" data-exid="${id}">${exLog.done?'✓':''}</div>
      </div>
      <div class="ex-inputs">
        <div style="flex:1">
          <label>Peso (kg)</label>
          <input type="number" inputmode="decimal" placeholder="—" data-field="peso" data-exid="${id}" value="${exLog.peso||''}">
        </div>
        <div style="flex:1">
          <label>Reps</label>
          <input type="text" inputmode="text" placeholder="—" data-field="reps" data-exid="${id}" value="${exLog.reps||''}">
        </div>
      </div>
    </div>`;
}

async function updateBadge(idx){
  const badge = document.getElementById(`badge_${currentPhase}_${idx}`);
  if(!badge) return;
  const d = PLAN[currentPhase].days[idx];
  const done = await dayIsDone(currentDate, currentPhase, idx, d);
  badge.classList.toggle('done', done);
  badge.textContent = done ? '✓' : '';
}

function switchView(view){
  document.getElementById('navPlan').classList.toggle('active', view==='plan');
  document.getElementById('navWeight').classList.toggle('active', view==='weight');
  document.getElementById('navHistory').classList.toggle('active', view==='history');
  document.getElementById('planTabContent').style.display = view==='plan' ? 'block' : 'none';
  document.getElementById('weightView').style.display = view==='weight' ? 'block' : 'none';
  document.getElementById('historyView').style.display = view==='history' ? 'block' : 'none';
  if(view==='history') renderHistory();
  if(view==='weight') renderWeightView();
}

async function getAllWeights(){
  try{
    const list = await window.storage.list('weight:');
    if(!list || !list.keys) return [];
    const keys = [...list.keys].sort().reverse();
    const out = [];
    for(const k of keys){
      const fullKey = k.startsWith('weight:') ? k : 'weight:' + k;
      const dateKey = fullKey.replace('weight:','');
      try{
        const res = await window.storage.get(fullKey);
        if(res) out.push({ dateKey, kg: res.value });
      }catch(e){ continue; }
    }
    return out;
  }catch(e){
    return [];
  }
}

async function seedInitialWeight(){
  try{
    const seedDate = daysAgoStr(1);
    const existing = await window.storage.get('weight:' + seedDate).catch(()=>null);
    if(!existing){
      await window.storage.set('weight:' + seedDate, '94.5');
    }
  }catch(e){}
}

async function renderWeightView(){
  document.getElementById('weightDate').value = todayStr();
  const list = document.getElementById('weightList');
  list.innerHTML = 'Cargando...';
  const weights = await getAllWeights();
  if(weights.length===0){
    list.innerHTML = '<div class="hist-empty">Sin registros de peso todavía.</div>';
    return;
  }
  let html = '';
  weights.forEach((w, i)=>{
    let deltaHtml = '';
    if(i < weights.length-1){
      const diff = parseFloat(w.kg) - parseFloat(weights[i+1].kg);
      const sign = diff>0?'+':'';
      const cls = diff>0?'delta-up':(diff<0?'delta-down':'');
      deltaHtml = `<span class="summary-delta ${cls}">${sign}${diff.toFixed(1)}</span>`;
    }
    html += `
      <div class="weight-row">
        <span class="weight-date">${formatDate(w.dateKey)}</span>
        <span><span class="weight-kg">${w.kg} kg</span>${deltaHtml}</span>
      </div>`;
  });
  list.innerHTML = html;
}

document.getElementById('weightSaveBtn').onclick = async ()=>{
  const date = document.getElementById('weightDate').value;
  const kg = document.getElementById('weightKg').value;
  if(!date || !kg) return;
  await window.storage.set('weight:' + date, kg);
  document.getElementById('weightKg').value = '';
  renderWeightView();
  renderSummary();
};

async function collectAllLogs(){
  const list = await window.storage.list('log:');
  const results = [];
  if(!list || !list.keys) return results;
  const keys = [...list.keys].sort().reverse();
  for(const k of keys){
    const fullKey = k.startsWith('log:') ? k : 'log:' + k;
    const dateKey = fullKey.replace('log:','');
    try{
      const res = await window.storage.get(fullKey);
      if(!res) continue;
      const log = JSON.parse(res.value);
      results.push({ dateKey, log });
    }catch(e){
      continue;
    }
  }
  return results;
}

async function renderHistory(){
  const container = document.getElementById('historyView');
  container.innerHTML = '<div class="hist-empty">Cargando...</div>';
  try{
    const all = await collectAllLogs();
    if(all.length===0){
      container.innerHTML = '<div class="hist-empty">Aún no hay sesiones registradas.</div>';
      return;
    }
    let html = `<button class="export-btn" id="exportBtn">Copiar historial para Claude</button><div class="export-box" id="exportBox"></div>`;
    let any = false;
    all.slice(0,30).forEach(({dateKey, log})=>{
      const entries = Object.entries(log);
      if(entries.length===0) return;
      let lines = '';
      entries.forEach(([key,val])=>{
        if(key.startsWith('customlist_')) return;
        if(key.startsWith('comment_')){
          if(val && val.trim()) lines += `<div class="hist-line"><span style="font-style:italic;">"${val}"</span><span></span></div>`;
        } else if(key.startsWith('p') && key.includes('_d')){
          if(val && val.done) lines += `<div class="hist-line"><span>Sesión completada</span><span>✓</span></div>`;
        } else {
          if(val && (val.done || val.peso || val.reps)){
            lines += `<div class="hist-line"><span>${exNameFromId(key, log)}</span><span>${val.peso? val.peso+'kg ' : ''}${val.reps||''}</span></div>`;
          }
        }
      });
      if(lines){
        any = true;
        html += `<div class="hist-item"><div class="hist-date">${formatDate(dateKey)}</div>${lines}</div>`;
      }
    });
    container.innerHTML = any ? html : '<div class="hist-empty">Aún no hay sesiones registradas.</div>';

    document.getElementById('exportBtn').onclick = async ()=>{
      const text = await buildExportText(all);
      const box = document.getElementById('exportBox');
      box.textContent = text;
      box.style.display = 'block';
      try{
        await navigator.clipboard.writeText(text);
        document.getElementById('exportBtn').textContent = 'Copiado — pégalo en el chat';
      }catch(e){
        document.getElementById('exportBtn').textContent = 'Selecciona y copia el texto de abajo';
      }
    };
  }catch(e){
    container.innerHTML = '<div class="hist-empty">No se pudo cargar el historial.</div>';
  }
}

async function buildExportText(all){
  let out = 'Registro de entrenamientos:\n\n';
  const weights = await getAllWeights();
  if(weights.length>0){
    out += 'Peso corporal:\n';
    weights.slice(0,20).reverse().forEach(w=>{
      out += `  ${w.dateKey}: ${w.kg} kg\n`;
    });
    out += '\n';
  }
  all.forEach(({dateKey, log})=>{
    const entries = Object.entries(log).filter(([k,v])=> v && (v.done || v.peso || v.reps || (typeof v === 'string' && v.trim())));
    if(entries.length===0) return;
    out += `${dateKey}\n`;
    entries.forEach(([key,val])=>{
      if(key.startsWith('customlist_')) return;
      if(key.startsWith('comment_')){
        if(val && val.trim()) out += `  Comentario: ${val}\n`;
      } else if(key.startsWith('p') && key.includes('_d')){
        if(val.done) out += `  Sesión marcada como completada\n`;
      } else {
        out += `  ${exNameFromId(key, log)}: ${val.peso?val.peso+'kg ':''}${val.reps||''}${val.done?' (hecho)':''}\n`;
      }
    });
    out += '\n';
  });
  return out;
}

function exNameFromId(id, log){
  if(id.startsWith('custom_') && log){
    for(const [k,v] of Object.entries(log)){
      if(k.startsWith('customlist_') && Array.isArray(v)){
        const found = v.find(e=>e.id===id);
        if(found) return found.name;
      }
    }
  }
  for(const phase of Object.values(PLAN)){
    for(const day of phase.days){
      if(day.exercises){
        const found = day.exercises.find(e=>e.id===id);
        if(found) return found.name;
      }
    }
  }
  return id;
}

function formatDate(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long' });
}

document.getElementById('datePicker').addEventListener('change', (e)=>{
  currentDate = e.target.value;
  renderWeek();
});

(async function init(){
  await seedInitialWeight();
  buildPhaseRow();
  goToday();
})();
</script>
